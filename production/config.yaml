# Production Training Configuration — 70k faces FP8 run
# Architecture: NanoDiT + TREAD + Muon + REPA + AsymFlow + torchao FP8 (Arm I scaled to 70k)
# Goal: Train a high-quality text-to-image portrait generator on consumer 4090 GPU in ~9-18 days.

model:
  hidden_size: 768             # Hidden dimension
  depth: 18                    # Number of transformer layers
  num_heads: 12                 # Attention heads
  patch_size: 16               # Pixel-space patchification (16x16)
  mlp_ratio: 4.0               # MLP expansion factor
  in_channels: 3               # RGB pixel channels (pixel-space training)
  prediction_type: x_prediction  # Pixel-space: model predicts x0 directly
  input_size: 1024             # Pixel resolution for sampling
  num_pose_joints: 133         # DWPose whole-body keypoints
  pose_confidence_threshold: 0.05  # Hard-mask joints below this confidence

training:
  total_steps: 40000           # Scaled step budget for 70k faces (approx 150 epochs @ batch 256)
  warmup_steps: 1000           # Linear LR warmup
  batch_size: 4                # Single-GPU batch size (FP8 allows batch 4 comfortably without gradient checkpointing)
  grad_accumulation_steps: 64  # Effective batch = 4 * 64 = 256

  optimizer:
    type: "Muon"                   # "Muon" (hybrid Muon+AdamW) or "AdamW" (all params)
    lr: 3.0e-4                     # Peak learning rate (shared by both optimizers)
    min_lr: 1.0e-6                 # Minimum LR after cosine decay
    betas: [0.9, 0.95]             # AdamW beta values (for non-2D params)
    weight_decay: 0.03             # Decoupled weight decay
    eps: 1.0e-8
    muon:
      momentum: 0.95               # Muon momentum factor
      nesterov: true               # Nesterov momentum
      ns_steps: 5                  # Newton-Schulz orthogonalization steps
      adjust_lr_fn: "match_rms_adamw"  # Scale updates to match AdamW RMS

  grad_clip: 1.0               # Gradient clipping norm
  ema_decay: 0.9999            # Target EMA decay
  ema_warmup_steps: 1000       # Warm EMA from 0 to target over N steps

  # CFG dropout (mutually exclusive categorical categories)
  cfg_dropout:
    p_uncond: 0.1              # Drop all conditioning (unconditional)
    p_text_only: 0.25          # Drop DINO + pose (text only)
    p_dino_cls_only: 0.05      # Drop text + patches + pose (keep only global style)
    p_dino_patches_only: 0.05  # Drop text + CLS + pose (keep only spatial layout)
    p_drop_pose: 0.10          # Drop only pose (text + DINO present)
    p_pose_only: 0.05          # Keep only pose (text + DINO dropped)
    # Remaining 40% keeps all signals (text + DINO + pose)

  # REPA (REPresentation Alignment) — align hidden states with DINOv3 patches
  # HASTE Trap Mitigation: decay REPA weight to 0 over 20%-40% of training steps.
  repa:
    enabled: true
    weight: 0.5                    # REPA loss weight
    block_index: -1                # Block to align at (-1 = depth // 2)
    loss_type: "cosine"            # "cosine" similarity
    decay_start_step: 8000         # Begin decaying REPA weight linearly toward 0 (20% of 40k)
    decay_end_step: 16000          # REPA weight reaches 0 at this step (40% of 40k)

  # TREAD (Token Routing) — route 50% of tokens past middle blocks for throughput
  tread:
    enabled: true
    routing_probability: 0.5       # Fraction of tokens to route (skip middle blocks)
    route_start: 1                 # First routed block (0-indexed)
    route_end: -1                  # Last routed block (-1 = depth - 2)
    self_guidance: true            # Use self-guidance instead of dual CFG at inference
    guidance_scale: 3.0            # Self-guidance scale

  # Timestep sampling strategy
  timestep_sampling: "logit_normal"  # "uniform" or "logit_normal"
  logit_normal_loc: 0.0              # Mean of logit-normal distribution
  logit_normal_scale: 1.0            # Std of logit-normal distribution

  # Memory optimization
  gradient_checkpointing: false      # Disabled because FP8 natively fits batch_size: 4 without it

  # Precision (Native FP8 via torchao)
  mixed_precision: true              # Use mixed precision
  precision: "fp8"                   # "fp8", "bfloat16", or "float32"

  perceptual:
    enabled: false
    lpips_weight: 0.1
    every_n_microsteps: 4
    crop_size: 256

  # Asymmetric Flow matching (Arm G) — target computed on lower-dim PCA subspace
  asymflow:
    enabled: true
    rank: 8                        # Rank of the noise subspace (typically 8 for 1024-dim patches)

  seg_weight:
    enabled: false                 # Disabled (ablation concluded spatial weighting was confounded)

data:
  source: "stratum"                                                # "webdataset" | "stratum"
  stratum_dir: "$STRATUM_DIR"                                      # expands to '/mnt/nas-ai-models/training-data/ffhq/stratum'
  stratum_max_samples: 70000                                       # Train on 70k faces!
  shard_base_dir: "data/shards/faces7k"
  
  # Aspect ratio buckets to read (each bucket is a subdirectory with tar files)
  buckets:
    - "bucket_1024x1024"
    - "bucket_1216x832"
    - "bucket_1280x768"
    - "bucket_1344x704"
    - "bucket_704x1344"
    - "bucket_768x1280"
    - "bucket_832x1216"
  
  bucket_sampling: "proportional"    # "proportional" or "uniform"
  num_workers: 8                     # High performance loader (Arm I baseline)
  prefetch_factor: 2                 # Batches to prefetch per worker
  pin_memory: true                   # Pin memory for faster GPU transfer

sampling:
  num_steps: 35                      # Euler integration steps
  text_scale: 3.0                    # CFG scale for text conditioning (dual CFG mode)
  dino_scale: 2.5                    # CFG scale for DINO conditioning (dual CFG mode)
  self_guidance: true                # Use self-guidance instead of dual CFG (pairs with TREAD)
  guidance_scale: 3.0               # Self-guidance scale

validation:
  enabled: true                      # Enable validation runs
  interval_steps: 500                # Run validation every N steps
  num_samples: 25                    # Number of samples to validate
  output_dir: "validation_outputs"   # Validation output directory
  
  run_reconstruction: true           # Test reconstruction LPIPS
  run_dino_swap: true                # Test DINO swap pairs
  run_text_manip: true               # Test text manipulation
  
  visual_debug_interval: 0           # Disabled during main production training to save VRAM/cycles
  visual_debug_num_samples: 4
  visual_debug_dir: "visual_debug"

checkpoint:
  save_every: 2500                   # Save checkpoint every N steps
  keep_last_n: 10                    # Keep last 10 checkpoints (per AGENTS.md)
  output_dir: "checkpoints"          # Checkpoint output directory
  save_optimizer: true               # Save optimizer state (needed for resume)

logging:
  log_every: 2                      # Log metrics every N steps
  log_file: "training.log"           # JSON-lines log file
  
  monitor_velocity_norm: true        # Track |v_pred| magnitude
  monitor_grad_norm: true            # Track gradient norm
  velocity_norm_warning: 10.0        # Warn if |v_pred| > this (collapse detection)
  grad_norm_warning: 10.0            # Warn if grad_norm > this after warmup

paths:
  t5_path: "models/t5xxl_fp16.safetensors"
