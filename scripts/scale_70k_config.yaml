# Scale-70k: Full production training on 70k FFHQ dataset
# Architecture: Arm D (full stack) — the proven winner
# Target hardware: Strix Halo APU (gfx1151, 124GB unified memory, ROCm 7.2)
# Run auto_tune.py on target hardware before training to set batch_size/grad_accumulation
#
# Resumable: use --resume <checkpoint_path> to continue from any checkpoint

model:
  hidden_size: 768
  depth: 18
  num_heads: 12
  patch_size: 16
  mlp_ratio: 4.0
  in_channels: 3
  prediction_type: x_prediction
  input_size: 1024
  num_pose_joints: 133
  pose_confidence_threshold: 0.05

training:
  # TODO: Set after running auto_tune.py on Strix Halo
  total_steps: 50000
  warmup_steps: 2000
  batch_size: 4          # placeholder — run auto_tune.py
  grad_accumulation_steps: 16  # placeholder — run auto_tune.py
  optimizer:
    type: Muon
    lr: 0.0003
    min_lr: 1.0e-06
    betas: [0.9, 0.95]
    weight_decay: 0.03
    eps: 1.0e-08
    muon:
      momentum: 0.95
      nesterov: true
      ns_steps: 5
      adjust_lr_fn: match_rms_adamw
  grad_clip: 1.0
  ema_decay: 0.9999
  ema_warmup_steps: 500
  cfg_dropout:
    p_uncond: 0.1
    p_text_only: 0.25
    p_dino_cls_only: 0.05
    p_dino_patches_only: 0.05
    p_drop_pose: 0.1
    p_pose_only: 0.05
  repa:
    enabled: true
    weight: 0.5
    block_index: -1
    loss_type: cosine
  tread:
    enabled: true
    routing_probability: 0.5
    route_start: 1
    route_end: -1
    self_guidance: true
    guidance_scale: 3.0
  timestep_sampling: logit_normal
  logit_normal_loc: 0.0
  logit_normal_scale: 1.0
  gradient_checkpointing: true  # placeholder — auto_tune.py may toggle
  mixed_precision: true
  precision: bfloat16
  perceptual:
    enabled: false
    lpips_weight: 0.1
    every_n_microsteps: 4
    crop_size: 256

data:
  stratum_dir: /mnt/nas-ai-models/training-data/ffhq/stratum
  shard_base_dir: data/shards/faces70k
  buckets:
    - bucket_1024x1024
  bucket_sampling: proportional
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true

sampling:
  num_steps: 35
  self_guidance: true
  guidance_scale: 3.0

validation:
  enabled: true
  interval_steps: 2500
  num_samples: 25
  output_dir: validation_outputs
  run_reconstruction: true
  run_dino_swap: true
  run_text_manip: true
  visual_debug_interval: 500
  visual_debug_num_samples: 4
  visual_debug_dir: visual_debug

checkpoint:
  save_every: 2500
  keep_last_n: 5
  output_dir: checkpoints
  save_optimizer: true

logging:
  log_every: 10
  log_file: training.log
  monitor_velocity_norm: true
  monitor_grad_norm: true
  velocity_norm_warning: 10.0
  grad_norm_warning: 10.0

paths:
  t5_path: models/t5xxl_fp16.safetensors
