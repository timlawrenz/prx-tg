# =============================================================================
# eidolon-identity-renderer (Arm EIR) — canonical config
#
# STATUS: PROVISIONAL — NOT FROZEN. No training run may launch against this file
# until the remaining TBDs are resolved and this header is replaced with the
# frozen-at-run-start statement (AGENTS.md §0.2, §0.7 rule 2).
#
# NOTE ON KEYS: every key below is declared on a config dataclass. Unknown keys
# now FAIL CLOSED (production/config_loader.py), because an unread key silently
# makes the config lie about the run — that is how hegre-geometry (2026-07-05)
# came to claim "weighted interleaving of ffhq (70%) + hegre (30%)" while its
# loader read one root. Earlier revisions of THIS file had three such keys
# (`experiment`, `extra_stratum_dirs`, `data.latent_mode`); all are gone.
# Verify with: .venv/bin/python scripts/smoke_stratum_dataloader.py
#
# What this arm tests (ablation hypothesis):
#   That a from-scratch FLUX-VAE latent DiT carrying the Eidolon adapter learns a
#   GENERALIZABLE identity mapping from a two-source LDA conditioning stream
#   (FFHQ per-image vectors + hegre persona centroids) rather than memorizing
#   per-image identity keys. No text: identity is the only content control.
#
# How it differs from the baseline:
#   - vs `latent-first-pretrain` (P1): Eidolon adapter replaces text/DINO
#     conditioning; hegre joins FFHQ as a training source (2:1 weighted).
#   - vs `eidolon-conditioning` / `hegre-geometry` (both PIXEL-space, ps16):
#     this arm trains in FLUX-AE latent space (in_channels 16, patch_size 2).
#   - vs `hegre-geometry`: trains in FLUX-AE latent space, the dropout profile is held
#     at Arm O's 0.10/0.20/0.30, and the multi-source that arm merely claimed is
#     actually implemented here (it was silently dropped).
#   - no warm-start, no PP stage, no weight donor, no REPA (hegre ships none).
#
# Expected outcome:
#   PASS on the pre-registered gate (held-out identity retrieval well above
#   chance on both probes; references 0.9504 at a 32-persona index, 0.8180 at
#   313, ~1.0 for the FFHQ fidelity probe). The informative failure to watch for
#   is the MEMORIZATION SIGNATURE: strong on trained identities, weak on held-out
#   ones — a FAIL even when the trained-identity number looks good.
#
# Gate + holdout: provenance.yaml and holdout.json (this directory).
# =============================================================================

adapter:
  name: "eidolon"
  identity_dim: 64
  z_g_dim: 50
  # Arm O's proven per-dim basis. The CFG guard lives in adapters.py
  # (EidolonAdapter.forward): the basis is only added when geometry is live,
  # which is what stopped Arm N's collapse. Do not enable without that guard.
  geometry_token_basis: true
  cfg_dropout:
    # Read by train.py L1372 for adapter_name == "eidolon": the adapter's own
    # 3-way partition, NOT the legacy 7-stream `training.cfg_dropout` schema.
    # Marginals of a partition; the remainder (0.40) = steps with BOTH live.
    p_uncond: 0.10
    # SETTLED 2026-09-24: 0.20 -- Arm O's profile, held deliberately.
    # This is the only slice that forces identity to render a face with NO z_g, which
    # is the pressure that stops z_g drifting into carrying facial structure. The gate
    # probes exactly that (same identity, different z_g) and z_g carries identity at
    # 8.31x the floor, so deleting this slice would trade gate safety for training mass.
    # The cost is real and accepted: AuraFace leaks pose (yaw R^2~0.46, pitch~0.64), so
    # this slice also teaches "invent a pose from identity" -- a state inference never
    # uses (z_g is always supplied). Dropping it would raise the both-present fraction
    # 0.40 -> 0.60, the slice where the disentanglement objective is trained; that
    # variant is deliberately deferred to a SEPARATE arm so a geometry result stays
    # attributable to Arm O's validated recipe.
    # LEDGER OBLIGATION: state the both-present fraction (0.40) in the result entry.
    p_identity_only: 0.20
    # geometry without identity — Arm O's recipe, the slice that produced
    # controlled yaw instead of the z_g -> identity shortcut.
    p_geometry_only: 0.30

model:
  hidden_size: 768             # P1's body: a known-good shape, no lineage claim
  depth: 18
  num_heads: 12
  patch_size: 2                # 128/2 = 64x64 tokens == the pixel ps16 grid
  mlp_ratio: 4.0
  in_channels: 16              # FLUX-AE latent channels
  prediction_type: x_prediction
  input_size: 128              # latent spatial size (1024px / 8x AE)
  latent_space: true           # latent-mode discriminator (drives the loader)

data:
  source: "stratum"
  stratum_dir: "/mnt/nas-ai-models/training-data/ffhq/stratum"   # validation/vdbg root
  # Weighted interleaving — IMPLEMENTED NOW (MultiStratumDataset). `weight` is a
  # relative DRAW SHARE per epoch: 2:1 = FFHQ drawn twice as often as hegre. The
  # binding root gets one full pass; a shorter root is recycled within the epoch
  # so the configured ratio actually holds for the whole epoch.
  stratum_dirs:
    - dir: "/mnt/nas-ai-models/training-data/ffhq/stratum"
      weight: 2.0
    - dir: "/mnt/nas-ai-models/training-data/eidolon/hegre_corpus"
      weight: 1.0
  # IDENTITY-BASIS GUARD: a mixed-basis identity slot trains silently, and that is
  # the defect that produced the mixed-basis Eidolon arms. Both trees carry this
  # fingerprint; the loader also measures the sampled vector norm (unit band).
  basis_fingerprint: "120e1c5a1dc4f423"
  allow_unstamped_identity: false
  # LOCKED identity-level holdout: 6,996 FFHQ identity dirs + 32 hegre personas
  # never enter training, so the gate measures generalization, not recall. The
  # loader verifies each list's recorded sha256 and fails closed if the manifest
  # does not describe the tree.
  holdout_manifest: "experiment-configs/eidolon-identity-renderer/holdout.json"

training:
  # SETTLED: 10k steps, granted and monitored in 1k BLOCKS. The block boundary is
  # the release point on the shared 4090 (see the latent-first 1k-SEGMENT policy):
  # reserve only to the next 1k boundary, and release there if another project is
  # queued. Not gated on a measured s/it — checkpoints land on the boundary.
  total_steps: 10000
  warmup_steps: 500
  batch_size: 4
  grad_accumulation_steps: 64  # effective batch = 256
  grad_clip: 1.0
  ema_decay: 0.9999
  ema_warmup_steps: 1000
  optimizer:
    type: "Muon"
    lr: 3.0e-4
    min_lr: 1.0e-6
    betas: [0.9, 0.95]
    weight_decay: 0.03
    eps: 1.0e-8
    muon:
      momentum: 0.95
      nesterov: true
      ns_steps: 5
      adjust_lr_fn: "match_rms_adamw"
  # The eidolon adapter drops both streams; disabling them avoids reading 8.4 MB
  # of dinov3_patches per sample for nothing.
  dino_patches:
    enabled: false
  repa:
    enabled: false             # hegre ships zero dinov3_patches.npy -> REPA is not
                               # available on the source that carries the mechanism
  tread:
    enabled: true
    routing_probability: 0.5
    route_start: 1
    route_end: -1
    self_guidance: true
    guidance_scale: 3.0
  timestep_sampling: "logit_normal"
  logit_normal_loc: 0.0
  logit_normal_scale: 1.0

# ── 1k-block execution (see training.total_steps) ──────────────────────────────
checkpoint:
  save_every: 1000         # one checkpoint per block: every boundary is a clean
                           # release point and a resumable state
  keep_last_n: 10          # a 10k run in 1k blocks keeps every boundary
  save_optimizer: true     # REQUIRED to resume across a block boundary
  output_dir: "checkpoints"

validation:
  enabled: true
  interval_steps: 1000     # aligned to the block boundary, not a second cadence
  num_samples: 16
  # This arm has no text stream and no DINO stream (both disabled above), so the
  # text-manipulation and dino-swap hooks have no input to vary. The identity
  # check for this arm is run_eidolon_identity_swap_test (validate.py L944),
  # wired into the gate harness; the in-run hooks are for liveness, not the verdict.
  run_reconstruction: true
  run_dino_swap: false
  run_text_manip: false
  visual_debug_interval: 1000
  visual_debug_num_samples: 4
