arm: eidolon-identity-renderer
arm_letter: EIR
aliases:
- eidolon-renderer
- identity-renderer
mode: confirmatory
status: active
hypothesis: 'A from-scratch FLUX-VAE latent DiT (P1-shaped: 16ch, 128x128, patch 2) carrying the Eidolon
  adapter (64-d AuraFace-LDA identity via adaLN + z_g geometry via cross-attention) learns a GENERALIZABLE
  identity mapping from the two-source LDA conditioning stream -- FFHQ per-image vectors plus hegre persona
  centroids -- rather than memorizing per-image identity keys. Stated as a prediction: conditioning on
  the vector of a person never seen in identity-training renders that person, and a pose change leaves
  the identity intact.'
falsified_if: 'Any of: (a) FFHQ unseen-identity fidelity R@1 CI LB <= 0.5 on the 6,996-identity holdout
  (chance 1.4e-4), or (b) hegre unseen-persona generalization cross-shoot R@1 CI LB <= 0.5 on the 32-persona
  holdout (chance 0.031), or (c) the MEMORIZATION SIGNATURE -- held-out scores are much weaker than trained-identity
  scores while the trained-identity number looks good. (c) is a FAIL even though a naive reading of its
  trained-identity number looks like success; it is the specific risk this arm exists to expose.'
pre_registered_gate: "PASS requires ALL THREE, each a rank-based retrieval R@1 with a PERSONA/IDENTITY-level\
  \ bootstrap CI and a hard floor of CI LB > 0.5 (chance is 1.4e-4 / 0.031 / 0.003 respectively, so 0.5\
  \ is unambiguously above chance and matches the bar the project's existing gates already use): (1) FFHQ\
  \ unseen-identity FIDELITY: 1-shot retrieval, index = the 6,996 held-out\n    identity vectors; reference\
  \ ceiling ~1.0 (measured VAE round-trip a1 = 0.9998).\n(2) hegre unseen-persona GENERALIZATION: cross-shoot\
  \ retrieval, index = the 32\n    held-out personas; reference ceiling 0.9504 measured AT THIS INDEX\
  \ SIZE.\n(3) hegre PERSISTENCE/RECALL: cross-shoot retrieval, index = all 313 corpus personas\n    (trained\
  \ personas included); reference ceiling 0.8180.\nREPORTING RULES THAT ARE PART OF THE GATE: - the renderer's\
  \ number must be read against the ceiling measured at the SAME index\n  size (the ceiling is index-size\
  \ dependent: 0.9504 at 32, 0.9005 at 96, 0.8180 at 313);\n- no absolute cosine threshold may be used\
  \ (the identity margin is ~0.0015 cosine and\n  the own/wrong-centroid distributions overlap);\n- batch.skipped\
  \ / no_face counts must be reported alongside every R@1 -- a face-filling\n  image returns no_face at\
  \ the corpus det_size convention (24/24 in a synthetic probe),\n  and silently dropping those would\
  \ compute the metric on the most flattering subset;\n- if the metric path fails to produce a number\
  \ for an arm, that is NOT a PASS. Non-identity criteria carried from the arm's design: decoded output\
  \ must not collapse (no void/darkness onset), and the geometry sweep must move pose monotonically across\
  \ z_g dim0 (Arm O's proven geometry diagnostic)."
differs_from: latent-first-pretrain
diff_summary: "- conditioning: text/DINO (P1) -> Eidolon adapter, identity (LDA 64-d, adaLN) + z_g\n \
  \ (50-d, cross-attention, per-dim basis). NO text stream at all.\n- data source: FFHQ stratum alone\
  \ -> FFHQ stratum PLUS hegre_corpus (the multi-shot\n  identity source; the only place pose-invariance\
  \ can be learned).\n- REPA dropped: hegre ships zero dinov3_patches.npy.\n- no warm-start, no PP stage,\
  \ no weight donor (fresh model, no lineage).\n- inherited from P1 and unchanged: 16ch FLUX-AE latent,\
  \ input_size 128, patch_size 2,\n  latent_space true, x_prediction, Muon lr 3e-4 -> min_lr 1e-6, effective\
  \ batch 256.\n- SETTLED (2026-09-24): step budget 10,000 in 1k blocks; ffhq:hegre = 2:1; unknown config\n\
  \  keys fail closed; the legacy keys this project's frozen configs carry are declared\n  no-ops (production/config_loader.py\
  \ LEGACY_KEYS), and THIS arm's config carries none --\n  verified by loading it: zero no-op warnings.\n\
  - SETTLED (2026-09-24): dropout profile held at Arm O's 0.10/0.20/0.30 (p_identity_only\n  0.20), so\
  \ the both-present fraction is 0.40 -- which is itself the ledger obligation to\n  report (the brief\
  \ flags P1/PP's failure as a dropout-marginal problem at ~0.40, so a\n  future arm may test 0.60 by\
  \ deleting the identity-only diagonal; deliberately NOT done\n  here, to keep a geometry result attributable\
  \ to Arm O's validated recipe).\n- STILL OPEN: architecture freeze (needs a latency measurement) and\
  \ the gate-eval harness.\n"
