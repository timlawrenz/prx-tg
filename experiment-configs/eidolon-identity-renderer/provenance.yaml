  there if another project is queued, auto-continue otherwise). checkpoint.save_every ==
  validation.interval_steps == 1000, so every boundary yields both a resumable state and a
  liveness sample; save_optimizer is true so a block resumed later continues the same
  trajectory. The budget is NOT gated on a measured s/it.
