axis_verification:
  question: Is z_g dim0 really the head-yaw axis that this arm's sweep conditions on?
  method: 300 real FFHQ training dirs carrying BOTH z_g.npy and pose.npy. Head yaw computed from each
    image's own DWPose 68-landmark face subset (pose.npy, COCO-WholeBody indices 23:91) as the nose-tip
    horizontal offset from the eye midpoint, normalised by interocular distance (signed; monotone in yaw).
    Then per-dimension Pearson correlation against z_g.
  result:
    dim0_abs_corr: 0.942
    dim0_rank: 1
    runner_up: dim3 0.202, dim7 0.176, dim4 0.168
    median_abs_corr_all_dims: 0.068
    z_g_per_dim_std: 1.053
    z_g_dim0_data_range: min -2.6, max +2.6
  verdict: 'CONFIRMED. dim0 is a near-pure yaw axis — 14x the median dimension, with all other dims at
    noise level. The sweep''s axis premise is VALID and its values are in-distribution: this arm is not
    conditioning on a wrong or empty axis. Consequence: the absent yaw in the rendered sweep is NOT a
    conditioning defect, so the suspect is downstream of the conditioning (the geometry path in the model,
    or eval-time dilution by the dual-CFG ladder).'
  evidence:
    script: experiment-configs/eidolon-identity-renderer/audit/zg_pose_audit.py
    figures:
    - experiment-configs/eidolon-identity-renderer/audit/zg_yaw_corr_perdim.png
    - experiment-configs/eidolon-identity-renderer/audit/zg_pose_audit.png
    - experiment-configs/eidolon-identity-renderer/audit/zg_sweep_landmarks.png
  documentation_discrepancy: 'The producing experiment (eidolon experiments/geometry_pca, arm zg-posenorm)
    records its shipped encoder as 3D-frontalized and pose-INVARIANT, reporting a 4.92x yaw suppression
    (std across yaw 1.451 -> 0.295). The shipped z_g is not pose-invariant in that sense: dim0 tracks
    yaw at |r| = 0.942. Either the FFHQ z_g predates the frontalized encoder (the zg tree is dated 2026-06-26,
    the encoder artifacts 2026-07-23) or the claimed invariance does not survive into the PCA space. It
    does not affect this arm — the data is what it is — but that provenance must NOT be read as "z_g carries
    no yaw".'
pose_diagnostics:
  summary: z_g dim0 is a validated yaw axis (see axis_verification). The rendered sweep does NOT turn
    the head at step 3006 under ANY conditioning ladder, including geometry-only at 10x. A positive control
    against Arm O (zg-token-basis-cfg-guard, the ledger's PASS arm) shows this is the NORMAL state at
    ~3k steps, not a failure of this arm.
  metric_validation:
    how: The identical sweep + DWPose yaw proxy (nose offset / interocular, COCO-133, CPU) run against
      Arm O's own checkpoints.
    arm_o_step3000: yaw spread 0-3 px, non-monotone at every ladder -> the ledger's step-3000 'visible
      yaw' is NOT reproducible by metric.
    arm_o_step5000: 8-15 px, MONOTONE (consistently signed) under geometry-dominant ladders -> the metric
      does detect a real binding, and the ledger's step-5000 claim is confirmed.
    verdict: 'METRIC VALIDATED. Consequence: a flat yaw at ~3k steps is unremarkable (Arm O was equally
      flat at 3000), so this arm''s step-3006 null is NOT evidence of failure. Re-test at 5000+ before
      judging.'
    evidence: experiment-configs/eidolon-identity-renderer/audit/armo_control/
  binding_is_weak: 8-15 px of nose movement is a few degrees, not the ~42 deg the sweep's 14 deg/sigma
    premise assumes. The binding is directional and real but far smaller than advertised — relevant before
    the identity gate leans on z_g for pose diversity.
  validator_ladder_blindness:
    finding: The binding appears ONLY under geometry-dominant conditioning (geoonly 0.0/4.0, 0.0/10.0,
      id1_geo8). Under this arm's validator ladder (identity 3.0 / geometry 2.0) it stays flat even at
      Arm O's step 5000, where the binding demonstrably exists.
    consequence: The in-run `eidolon_geometry_sweep` cannot see a real yaw binding, so a 'no yaw' reading
      from it is unfalsifiable — which is also why the ledger's yaw was 'visually assessed'.
    obligation: Add a geometry-dominant ladder to the sweep BEFORE any arm's yaw is judged.
  cfg_guard_defect:
    finding: adapters.py:284 guards the per-dim token basis with `not cfg_drop_geo.all()`, but train.py:282
      draws the CFG dropout PER SAMPLE (`torch.rand(B)`). The basis is therefore skipped only when the
      ENTIRE batch is geometry-dropped — 0.3^B, i.e. ~0.8% of steps at B=4. On the other ~99% it is added
      even to geometry-zeroed samples, the 'pure noise injection' the ledger blames for Arm N's collapse.
    introduced: 86bab8a (2026-07-19) — Arm O's own fix commit, so Arm O trained under the same defect.
    inference_time: 'Correct: drop_all skips the basis, keep_all adds it.'
    status: REAL DEFECT, unfixed. Not the cause of the step-3006 null (Arm O carries it too and binds
      by 5k).
  vacuous_pass_risk:
    finding: The registered gate is identity consistency (R@1 > 0.5 on three probes) across different
      z_g. If z_g produces no pose diversity, the model renders the same frontal face whatever z_g says,
      and 'same identity across different poses' is satisfied because there are no different poses.
    consequence: A PASS on the registered gate would be VACUOUS if the geometry stream never produces
      pose variation. This must be reported WITH the verdict, not discovered after it.
    mitigation: Report measured pose diversity (sweep response under a geometry-dominant ladder) alongside
      the gate result, and prefer the seed-variation identity probe (same identity, different noise seeds),
      which does not depend on geometry working at all.
  real_data_signal_test:
    question: Is the rendered eye-region patch (grey mass falling monotonically with z_g dim0, 0.3158
      -> 0.0805 on step0006000/sample30) a faithful reproduction of a real eye-region correlate of yaw
      in the training data?
    method: Identical metric (desaturated mid-luminance fraction, sat<=40 & 40<val<230) and identical
      crop geometry (r = 0.35 x interocular, iBUG 36-47) applied to n=400 real FFHQ training images, against
      their true yaw from pose.npy (nose x-offset / interocular, normalised landmarks converted to pixels).
    result:
      r_grey_vs_yaw_imageleft: -0.045
      r_grey_vs_yaw_imageright: 0.031
      r_grey_vs_absyaw:
      - -0.024
      - 0.003
      r_grey_vs_zgdim0:
      - 0.051
      - -0.017
      per_yaw_quintile:
      - 0.07
      - 0.0845
      - 0.0634
      - 0.0779
      - 0.0517
      per_image_grey_std: 0.115
    verdict: NO SUCH SIGNAL IN THE DATA. The rendered patch is not a data correlate; the model manufactures
      an ordered response to dim0 that nothing in the training set supports.
    interpretation: 'Consistent with: the model has learned a dependency on the conditioning dimension
      (the signal reaches the pixels, ordered) without yet implementing the geometry. Also consistent
      with the pre-existing measurement that dim0 <-> real yaw IS a true axis in the data (|r|=0.942):
      the input carries yaw, and the renderer has not yet turned that into rotation. NOT evidence of a
      dead or detached conditioning path.'
  yaw_emergence_and_mechanism:
    emergence: 'The z_g dim0 -> head rotation response appeared BETWEEN step 5000 and step 7000, inside
      the 10k budget. Probe (4 CFG ladders x 3 samples, seed 1234, 50-step sampler, latent space, VAE-decoded):
      step 5000 = 7-35 px nose displacement, mostly non-monotone under the standard ladder; step 7000
      = 46-93 px, MONOTONE decreasing in all 12 ladder/sample rows. Prediction recorded earlier ("yaw
      should appear around 4-5k if this arm follows Arm O''s schedule") was directionally right; it arrived
      by 7k.'
    validator_ladder_note_corrected: 'The earlier note that the validator''s ladder (identity 3.0 / geometry
      2.0) is BLIND to the binding is too strong. It was INSENSITIVE while the signal was weak (<=5000:
      7-9 px). At step 7000 the same standard ladder shows 46-52 px, monotone. A geometry-dominant ladder
      is still the more sensitive instrument early on, but the standard ladder is not blind.'
    mechanism_test:
      question: 'Operator read of the step-7000 geometry-dominant grid: "partial deformation (the sides
        are shortened), partial real 3d occlusion (the nose shows the person''s nose left side, hides
        the nose''s right side and vice versa)". Is it a real 3D projection or a 2D squash?'
      method: 'Discriminating signature in the 68 iBUG landmarks: a true rotation leaves the projected
        interocular nearly constant (eyes lie near the rotation axis) while hiding the far cheek (asymmetric
        jaw distances to the nose tip); a 2D squash shortens both sides together and changes the interocular.
        Reference: n=500 real FFHQ faces with yaw from pose.npy; render: step-7000 geoonly_id0_geo10 panels,
        DWPose landmarks, identical metric definitions.'
      real_reference:
        inter_over_median_by_yaw_bin:
        - 0.916
        - 0.992
        - 1.004
        - 1.004
        - 0.991
        - 0.927
        L_over_R_by_yaw_bin:
        - 0.19
        - 0.47
        - 0.83
        - 1.23
        - 2.02
        - 4.25
      render:
        sample10:
          inter:
          - 1.0
          - 1.093
          L_over_R:
          - 4.29
          - 1.02
        sample30:
          inter:
          - 1.0
          - 1.072
          L_over_R:
          - 7.65
          - 0.85
        sample50:
          inter:
          - 1.0
          - 1.122
          L_over_R:
          - 6.39
          - 0.81
      verdict: 'BOTH OPERATOR READINGS CONFIRMED, and separated. The render reproduces genuine 3D OCCLUSION
        — the far-side jaw distance collapses as the head turns, L/R swinging 4-9x in the correct direction,
        stronger per unit yaw than real faces. But its in-plane metric is inconsistent: the projected
        interocular GROWS 7-12% with yaw where a true projection holds it flat or shrinks it ~8%. The
        model has learned what gets hidden without getting the projective geometry consistent.'
      cross_check_standard_ladder: 'Re-run under fullcfg_id3_geo2 (identity anchored at 3.0, so the face
        is not free to drift for lack of an identity anchor): SAME pattern. inter 1.000 -> 1.096 / 1.066
        / 1.093 for samples 10/30/50, face width growing up to +21%, L/R swinging 2.38 -> 0.85. So the
        in-plane widening is a property of the geometry handling, not an artefact of the identity-free
        ladder. Occlusion remains quantitatively plausible under both ladders (the L/R range corresponds
        to real faces at yaw +-0.15..0.25).'
      implication: 'This is a partially correct 3D solution, not a 2D fake: the occlusion is data-grounded
        (real faces carry it durably; unlike the eye-grey patch, which the data does NOT carry). The residual
        error is a global projective inconsistency, which requires coordinating the whole face rather
        than a local patch — consistent with the case for a longer run.'
    data_coverage_audit:
      method: yaw/pitch/roll proxies from pose.npy over n=10000 FFHQ training images; dim0->yaw regression
        on the same images
      ffhq_yaw:
        std: 0.195
        p1: -0.515
        p5: -0.31
        p25: -0.106
        median: 0.001
        p75: 0.104
        p95: 0.311
        p99: 0.511
        min: -1.036
        max: 1.235
        sign_split:
        - 0.496
        - 0.504
      ffhq_yaw_tail_fractions:
        gt_0.10: 0.514
        gt_0.25: 0.166
        gt_0.40: 0.051
        gt_0.60: 0.011
      ffhq_pitch:
        std: 0.121
        p1: 0.227
        p99: 0.821
        median: 0.545
      ffhq_roll_deg:
        std: 1.974
        p1: -5.58
        p99: 5.63
      dim0_to_yaw:
        formula: yaw = -0.0037 - 0.1831 * dim0
        r: -0.937
        note: 'slope is NEGATIVE, matching the render''s monotone-decreasing response in all 12 rows:
          the model learned the correct sign of the axis.'
      sweep_support:
        dim0_-3.0:
          implied_yaw: 0.5456
          n_within_0.05: 53
          n_total: 10000
          in_support: false
        dim0_-1.5:
          implied_yaw: 0.271
          n_within_0.05: 592
          in_support: true
        dim0_0.0:
          implied_yaw: -0.0037
          n_within_0.05: 2798
          in_support: true
        dim0_1.5:
          implied_yaw: -0.2783
          n_within_0.05: 576
          in_support: true
        dim0_3.0:
          implied_yaw: -0.553
          n_within_0.05: 58
          n_total: 10000
          in_support: false
      verdict: 'FFHQ is PEAKED AT FRONTAL WITH THIN TAILS, not evenly distributed. The sweep''s +/-3 sigma
        commands implied yaw +/-0.55, beyond the data p99 (+/-0.51) with 0.5% local support: the strongest
        demonstrations of rotation are partly OUT-OF-DISTRIBUTION EXTRAPOLATION. The occlusion component
        matched real faces at yaw +/-0.15..0.25, where the data IS dense (16.6%). The model is accurate
        where the data is dense and inventive where it is thin - the best current explanation of the in-plane
        widening, and one that more training will not fix because the evidence is absent.'
      obligations:
      - 'Measure the hegre pose distribution (20k personas, 1/3 of effective data): path unresolved, numbers
        unknown.'
      - Report a +/-1.5 sigma sweep row as the IN-DISTRIBUTION claim and label +/-3 sigma as extrapolation.
      - If synthetic yaw is introduced it must be 3D (3DMM reposing / multiview). 2D-warp augmentation
        would reinforce the measured in-plane deformation defect and make it worse.
      - 'Cheapest real-geometry option first: re-weight/oversample the existing tails (5.1% of FFHQ is
        beyond +/-0.40).'
  lr_schedule_implication:
    schedule: linear warmup 500 -> cosine decay to min_lr over total_steps=10000 (train.py:677)
    observation: lr is 3.0e-4 at warmup end, ~1.1e-4 at step 6000, and reaches min_lr 1e-6 at 10k. The
      remaining 4k steps therefore have little capacity to acquire NEW structure (head rotation), which
      is consistent with the plan for a longer attempt.
    consequence: 'A 50k/100k attempt CANNOT be a continuation of this run: the cosine has already decayed
      to 1e-6 over a 10k horizon, so continuing would train at ~1e-6 and freeze. It needs a fresh schedule
      over the longer horizon (warm-start from the 10k checkpoint with re-warmed lr is far cheaper than
      from scratch).'
