arm: pixel-posttrain
arm_letter: PP            # "P2" is already taken by geo-adapter-bugfix-restart,
                          # so this arm uses PP (pixel post-train) to avoid collision.
aliases: [pixel-posttrain-p1-warmstart]
status: cancelled_tainted # CANCELLED by Tim 2026-09-21: warm-started from the ungated,
                          # tainted P1 checkpoint. Run 2026-09-20_1413 stopped at step
                          # 2198 of 10000. Do NOT resume or build on this run.
mode: confirmatory        # gate frozen 2026-09-20 BEFORE the first run
cancellation:
  date: 2026-09-21
  stopped_at_step: 2198
  reason: >
    Warm-start source (P1 step-10000) was never officially gated and is diagnosed
    as memorizing DINOv3 CLS tokens as per-image keys while ignoring text
    conditioning. The taint propagates through the warm start; this arm could
    never answer its own gate. Redesign: .hermes/plans/2026-09-22_0000-p1-pp-gated-redesign.md
  run_dirs:
    - experiments/pixel-posttrain/runs/2026-09-20_1413

hypothesis: >
  Warm-starting pixel-space training from the P1 latent-pretrain body (182 of 188
  tensors) beats the from-scratch pixel champion (Arm J, faces70k-fp8) at the same
  10,000-step budget, because P1 already supplies semantic structure and leaves P2
  only the texture/photorealism work.

falsified_if: >
  At 10,000 steps P2 does not beat Arm J's matched step-10,000 values on the
  decoded-image metrics (recon LPIPS <= 0.8264, text_only <= 0.9375, text_manip
  <= 0.3443), or its G0 gates sit no closer to the frozen real-FFHQ band than
  Arm J's. That would mean the latent pretrain bought nothing for photorealism.

pre_registered_gate: >
  PASS if at step 10000 ALL of: (1) recon LPIPS <= 0.8264 AND text_only <= 0.9375
  AND text_manip <= 0.3443 (strictly better than Arm J at the same step);
  (2) aesthetic >= 4.8183 AND CLIP >= 0.2193 AND face_conf >= 0.8585;
  (3) >= 4 of the 6 G0 gates in-band vs the frozen real-FFHQ band
  (research/avenues/gates_calibration.json); (4) no collapse: clean loss/grad and
  no NaN through the first 1000 steps, non-degenerate visuals.

differs_from: faces70k-fp8
diff_summary: |
  SCIENTIFIC (exactly one variable):
  - warm start from the P1 step-10000 checkpoint via --init-from
    (production/warm_start.py): 182/188 tensors transferred; the I/O projection
    modules x_embedder / final_proj / output_conv re-initialised; optimizer FRESH;
    EMA re-seeded from the warm weights.
  INSTRUMENTATION / BUDGET (not scientific variables):
  - total_steps 40000 -> 10000 (user budget decision)
  - checkpoint.save_every 2500 -> 500 (a clean checkpoint must land exactly ON
    each 1k segment boundary for the 1k-segment GPU policy)
  - validation.visual_debug_interval 0 -> 1000 (visuals to review at boundaries)
  - validation.interval_steps / num_samples kept VERBATIM (500 / 25) so the
    step-10000 validation is like-for-like with Arm J's
  - repa.decay_start_step / decay_end_step kept VERBATIM (8000 / 16000) so the
    step-10000 comparison is one-variable; consequence: REPA weight is still 0.375
    at the gate step and never fully sheds inside this budget (P1 used 4000->8000).

