# =============================================================================
# Arm P2 — pixel-posttrain: pixel-space post-train WARM-STARTED from the P1
# latent pretrain (latent-first-pretrain, step 10000).
#
# WHAT IT TESTS
#   Warm-starting pixel-space training from the P1 latent-pretrain body (182 of
#   188 tensors) beats the from-scratch pixel champion (Arm J, faces70k-fp8) AT
#   THE SAME 10,000-STEP BUDGET, because P1 already supplies semantic structure
#   and leaves P2 only the texture/photorealism work.
#
#   Gate anchor = Arm J's OWN recorded numbers at step 10,000 (matched step,
#   same 70k data, same architecture, same validation protocol):
#     recon LPIPS 0.8264 | text_only 0.9375 | text_manip 0.3443
#     aesthetic 4.8183 | CLIP 0.2193 | face conf 0.8585
#   See provenance.yaml for the frozen pre_registered_gate / falsified_if.
#
# HOW IT DIFFERS FROM THE BASELINE (Arm J, experiments/faces70k-fp8/config.yaml)
#   SCIENTIFIC difference — exactly one:
#     * the model is WARM-STARTED from the P1 10k checkpoint via `--init-from`
#       (production/warm_start.py): every shape-matching tensor transfers, the
#       three I/O projection modules (x_embedder, final_proj, output_conv) are
#       re-initialised, the optimizer starts FRESH, and the EMA is re-seeded
#       from the warm weights.
#
#   INSTRUMENTATION/BUDGET differences (NOT scientific variables):
#     * total_steps 40000 -> 10000   (user budget decision 2026-09-20)
#     * checkpoint.save_every 2500 -> 500
#         The 1k-segment GPU policy (user directive 2026-09-18) releases the GPU
#         at each 1000-step boundary and requires a clean checkpoint to sit
#         exactly ON that boundary. save_every 2500 would leave boundaries with
#         no checkpoint, so the segment machinery could not stop cleanly.
#     * validation.visual_debug_interval 0 -> 1000
#         Arm J had visual debug OFF for production. The segment policy releases
#         the GPU at boundaries specifically SO THE VISUALS CAN BE REVIEWED; with
#         it off there would be nothing to review at a boundary.
#     * validation.interval_steps / num_samples kept VERBATIM (500 / 25) so the
#         step-10000 validation is directly comparable to Arm J's step-10000.
#
#   REPA decay is kept VERBATIM at 8000 -> 16000 (user decision 2026-09-20) even
#   though P2 is only 10k steps, so REPA weight is still 0.375 at the gate step.
#   That is deliberate: it keeps the step-10,000 comparison one-variable. The
#   consequence to remember when reading the result: P2 never fully sheds the
#   REPA scaffold inside this budget, unlike P1 (which used 4000 -> 8000).
#
# EXPECTED OUTCOME
#   At step 10,000, P2 should beat Arm J's step-10,000 image metrics, since the
#   semantic/structure work P1 already did is exactly what Arm J was still
#   buying at 10k (Arm J was still REPA-constrained then). If P2 does NOT beat
#   it, the latent pretrain bought nothing for photorealism and the P1->P2
#   program is falsified for this budget.
# =============================================================================

model:
  hidden_size: 768
  depth: 18
  num_heads: 12
  patch_size: 16               # Pixel-space patchification (16x16)
  mlp_ratio: 4.0
  in_channels: 3               # RGB pixel channels
  prediction_type: x_prediction
  input_size: 1024             # Pixel resolution for sampling
  num_pose_joints: 133
  pose_confidence_threshold: 0.05

training:
  total_steps: 10000           # DEVIATION: was 40000 in Arm J (user budget)
  warmup_steps: 1000
  batch_size: 4
  grad_accumulation_steps: 64  # effective batch = 4 * 64 = 256

  optimizer:
    type: "Muon"
    lr: 3.0e-4
    min_lr: 1.0e-6
    betas: [0.9, 0.95]
    weight_decay: 0.03
    eps: 1.0e-8
    muon:
      momentum: 0.95
      nesterov: true
      ns_steps: 5
      adjust_lr_fn: "match_rms_adamw"

  grad_clip: 1.0
  ema_decay: 0.9999
  ema_warmup_steps: 1000

  cfg_dropout:
    p_uncond: 0.1
    p_text_only: 0.25
    p_dino_cls_only: 0.05
    p_dino_patches_only: 0.05
    p_drop_pose: 0.10
    p_pose_only: 0.05

  repa:
    enabled: true
    weight: 0.5
    block_index: -1
    loss_type: "cosine"
    decay_start_step: 8000     # VERBATIM Arm J — see header note
    decay_end_step: 16000      # VERBATIM Arm J — never reached inside 10k

  tread:
    enabled: true
    routing_probability: 0.5
    route_start: 1
    route_end: -1
    self_guidance: true
    guidance_scale: 3.0

  timestep_sampling: "logit_normal"
  logit_normal_loc: 0.0
  logit_normal_scale: 1.0

  gradient_checkpointing: false
  mixed_precision: true
  precision: "fp8"

  perceptual:
    enabled: false
    lpips_weight: 0.1
    every_n_microsteps: 4
    crop_size: 256

  asymflow:
    enabled: true
    rank: 8

  seg_weight:
    enabled: false

data:
  source: "stratum"
  stratum_dir: "$STRATUM_DIR"
  stratum_max_samples: 70000
  pixel_range: "-11"           # zero-mean centred to [-1,1]
  buckets:
    - "bucket_1024x1024"
    - "bucket_1216x832"
    - "bucket_1280x768"
    - "bucket_1344x704"
    - "bucket_704x1344"
    - "bucket_768x1280"
    - "bucket_832x1216"
  bucket_sampling: "proportional"
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true

sampling:
  num_steps: 35
  text_scale: 3.0
  dino_scale: 2.5
  self_guidance: true
  guidance_scale: 3.0

validation:
  enabled: true
  interval_steps: 500          # VERBATIM Arm J — 500 lands exactly on 10000
  num_samples: 25              # VERBATIM Arm J — needed for a like-for-like gate
  output_dir: "validation_outputs"
  run_reconstruction: true
  run_dino_swap: true
  run_text_manip: true
  visual_debug_interval: 1000  # DEVIATION: was 0; one collage per 1k boundary
  visual_debug_num_samples: 4
  visual_debug_dir: "visual_debug"

checkpoint:
  save_every: 500              # DEVIATION: was 2500; must land on 1k boundaries
  keep_last_n: 10
  output_dir: "checkpoints"
  save_optimizer: true

logging:
  log_every: 2
  log_file: "training.log"
  monitor_velocity_norm: true
  monitor_grad_norm: true
  velocity_norm_warning: 10.0
  grad_norm_warning: 10.0

paths:
  t5_path: "models/t5xxl_fp16.safetensors"
