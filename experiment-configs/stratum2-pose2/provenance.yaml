notes: >
  FFHQ pose2 enrichment is actively running on 4090 + Strix Halo. The data
  loader uses v1 fallback (133kp) for images without pose2.npy, so training
  starts immediately. Images with pose2 get 308kp (274 face landmarks);
  images without get 133kp (68 face landmarks). The model's pose_joint_embed
  table has 308 entries — v1 images use the first 133.

  RECORD RECOVERY 2026-09-20: this provenance predated the AGENTS.md §0.3 schema and
  was missing `mode`, `falsified_if`, `pre_registered_gate`, `branch` and `run_dirs`,
  which made scripts/check_arm_records.py exit non-zero for the whole repo. The four
  content fields are now filled honestly (see `mode` — no peek has occurred, so this
  remains a valid pre-registration). `run_dirs` is intentionally empty because the arm
  has never run; `status: planned` states that explicitly instead of fabricating a run
  directory.
