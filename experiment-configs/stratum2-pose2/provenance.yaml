arm: pose2                       # slug directory: experiment-configs/stratum2-pose2/
arm_letter: P2
aliases: [stratum2-pose2, pose2-ablation]
mode: confirmatory               # Set 2026-09-20. This is a genuine PRE-registration,
                                 # not a retro-fit: the arm has NEVER BEEN RUN (see
                                 # `status` below), so no result has been peeked and the
                                 # mode can still honestly be declared before run 1.
hypothesis: >
  308-keypoint Sapiens 2 pose (pose2.npy, 274 face landmarks vs 68 in DWPose)
  improves face generation quality over the 133-keypoint DWPose baseline on FFHQ.
falsified_if: >
  The 308kp pose arm does NOT beat the 133kp DWPose baseline on the stated evaluation
  (Aesthetic score + CLIP Score + DWPose confidence trajectories) at an equal step
  budget — i.e. face-generation quality is equal or worse, so the extra 274 face
  landmarks buy nothing.
pre_registered_gate: >
  NOT YET FROZEN — deliberately. No numeric gate was frozen when this config was
  committed (2026-08-01) and the arm has never been run (no NAS arm dir, no run dir,
  no ledger entry), so nothing has been peeked and a real gate can still be
  pre-registered before the first launch. A numeric gate MUST be written here
  (metric + threshold, plus "no regression on the baseline's own metrics") and
  committed BEFORE the first training step, per AGENTS.md §0.7 rule 2. Until then
  this arm is a PLAN, not a concluded experiment.
differs_from: production baseline (config.yaml)
diff_summary: |
  Single variable changed:
  - model.num_pose_joints: 133 → 308
  - adapter.num_pose_joints: 133 → 308
  - Data loader loads pose2.npy when available (v1 fallback for unenriched images)
  Everything else is identical to the production config:
  - seg_weight: disabled (same as production)
  - geometry_3d: disabled
  - matting_edge: disabled
  - All hyperparameters unchanged

