arm: latent-first-pretrain-sanity
arm_letter: LFPS
aliases: [latent-first-sanity, sanity-latent-first]
mode: confirmatory               # Gate frozen and committed BEFORE the 2026-09-20 run.
hypothesis: >
  The deterministic validation seeding added 2026-09-20 (VALIDATION_NOISE_SEED_BASE +
  sample index, drawn from a LOCAL torch.Generator) makes in-train validation results
  reproducible by a standalone re-run against the same checkpoint, without perturbing
  the training RNG stream.
falsified_if: >
  Either (a) any instrumented hook fails to fire inside the run window, or (b) a
  standalone re-run of a checkpoint does NOT reproduce that checkpoint's in-train
  seeded validation numbers. (b) proves the seeding change does not deliver
  reproducibility, in which case commit cf29208 is reverted.
pre_registered_gate: >
  PASS if ALL of: (1) the run completes 60/60 steps with no NaN/divergence;
  (2) every hook fires in-window — visual_debug at 20/40/60, validation at 30/60,
  checkpoint_step0000030.pt and checkpoint_step0000060.pt written;
  (3) validation/step0000030/results.json and validation/step0000060/results.json
  exist and each contain all four tests (reconstruction, text_only, dino_swap,
  text_manip); (4) THE CONTROL — re-running the validation standalone against
  checkpoint_step0000060.pt reproduces the in-train step-60 numbers to within
  numerical tolerance (reconstruction mean LPIPS abs diff <= 1e-3).
  FAIL otherwise; on (4) failing, revert the seeding change rather than shipping it.
differs_from: latent-first-pretrain
diff_summary: |
  Same architecture, data and latent mode (FLUX-AE, in_channels=16, patch_size=2,
  128x128 latent = 64x64 token grid). Only budget + instrumentation cadence reduced:
  - total_steps 10000 -> 60
  - warmup_steps 500 -> 10
  - grad_accumulation_steps 64 -> 16 (effective 256 -> 64)
  - ema_warmup_steps 1000 -> 10
  - repa decay 4000/8000 -> 20/40
  - validation.interval_steps 2500 -> 30 (fires at 30 and 60)
  - visual_debug_interval 500 -> 20 (fires at 20, 40, 60)
  - checkpoint.save_every 500 -> 30 (fires at 30 and 60)

