notes: >
  Runs dated before 2026-09-20 used the OLD unseeded validation sampling and are kept
  as history only — their per-step LPIPS numbers are not comparable to each other or
  to the seeded runs, because each validation call drew from the global RNG state.
  Only runs from 2026-09-20 onward are seed-controlled.

  This arm is an instrumentation/reproducibility harness, NOT a model-quality arm:
  its 60-step model is meaningless as a quality artifact and must never be cited as
  evidence about generation quality.
