# Production Training Configuration — latent-first pretrain (Arm: latent-first-pretrain)
# Scheme B Phase 1: learn semantics in FLUX-AE latent space (16ch, 8x). 1024px -> 128x128 latent.
# Token grid: 128/2 = 64x64 tokens == pixel ps16 grid (same DINOv3 patch alignment).
# Later: pixel-space post-training (Z-Image/L2P recipe) is a SEPARATE arm (not this config).
#
# Differs from champion (faces70k-fp8): in_channels 16 (latent), patch_size 2 (same 64x64 grid),
# prediction_type x_prediction on LATENT x0 (target = clean latent), flux_latent.npy data source,
# latent_space: true (samplers decode via FLUX AE). Same 70k data, same conditioning stack.
# Expected outcome: semantic/structural fidelity faster than pixel-from-scratch; measured by
# G0 gates + blind review on decoded latents.

model:
  hidden_size: 768             # Same transformer body as champion (transfer-friendly)
  depth: 18
  num_heads: 12
  patch_size: 2                # 128/2 = 64x64 tokens (matches pixel ps16 grid)
  mlp_ratio: 4.0
  in_channels: 16              # FLUX-AE latent channels (was 3 for pixels)
  prediction_type: x_prediction  # Predict clean latent x0 (in latent space)
  input_size: 128              # Latent spatial size (1024px / 8x AE)
  latent_space: true           # NEW: latent-mode discriminator (sampler decodes via FLUX AE)
  num_pose_joints: 133
  pose_confidence_threshold: 0.05

training:
  total_steps: 10000           # Sized to fit scheduler cap: measured 35s/it (2026-09-13) ->
                               # 15k = ~146h > 108h effective cap (96h claim x 1.5); 10k = ~97h.
                               # Latent semantic pretrain (Phase 1); Phase-2 pixel post-train adds the rest.
  warmup_steps: 500            # Linear LR warmup
  batch_size: 4                # Single-GPU batch (latent 16ch x 128x128 is ~12x smaller than pixels)
  grad_accumulation_steps: 64  # Effective batch = 256

  optimizer:
    type: "Muon"
    lr: 3.0e-4
    min_lr: 1.0e-6
    betas: [0.9, 0.95]
    weight_decay: 0.03
    eps: 1.0e-8
    muon:
      momentum: 0.95
      nesterov: true
      ns_steps: 5
      adjust_lr_fn: "match_rms_adamw"

  grad_clip: 1.0
  ema_decay: 0.9999
  ema_warmup_steps: 1000

  # CFG dropout (same profile as champion)
  cfg_dropout:
    p_uncond: 0.1
    p_text_only: 0.25
    p_dino_cls_only: 0.05
    p_dino_patches_only: 0.05
    p_drop_pose: 0.10
    p_pose_only: 0.05

  # REPA — align latent hidden states with DINOv3 patches (grid 64x64 == 64x64)
  repa:
    enabled: true
    weight: 0.5
    block_index: -1
    loss_type: "cosine"
    decay_start_step: 4000
    decay_end_step: 8000

  tread:
    enabled: true
    routing_probability: 0.5
    route_start: 1
    route_end: -1
    self_guidance: true
    guidance_scale: 3.0

  timestep_sampling: "logit_normal"
  logit_normal_loc: 0.0
  logit_normal_scale: 1.0

  gradient_checkpointing: false
  mixed_precision: true
  precision: "fp8"            # FP8 mandatory: bf16 at eff-batch 256 was 41s/it = 227h for 20k.
                              # Champion-proven FP8 ≈13s/it → 20k ≈ 72h inside scheduler's
                              # 1.5x-duration enforcement (108h). Lambda-eval: PatchEmbed K=16
                              # ≥ champion's K=3, alignment guard holds.

  perceptual:
    enabled: false             # LPIPS runs on decoded latent crops — enable after Phase 1 sanity
    lpips_weight: 0.1
    every_n_microsteps: 4
    crop_size: 256

  asymflow:
    enabled: false             # Latent-space velocity is lower-dim; keep baseline flow first

  seg_weight:
    enabled: false

data:
  source: "stratum"
  stratum_dir: "$STRATUM_DIR"
  stratum_max_samples: 70000
  latent_mode: true            # NEW: read flux_latent.npy (16,128,128) instead of pixel.npy
  buckets:
    - "bucket_1024x1024"
    - "bucket_1216x832"
    - "bucket_1280x768"
    - "bucket_1344x704"
    - "bucket_704x1344"
    - "bucket_768x1280"
    - "bucket_832x1216"
  bucket_sampling: "proportional"
  num_workers: 24                # Pitfall 20: stratum loader starves at 8/2 (GPU 0<->100% osc).
                                 # gamma2-proven: 24/8 -> ~13 s/it at eff-batch 256.
  prefetch_factor: 8
  pin_memory: true

sampling:
  num_steps: 24                # Latent space is 8x smaller — fewer Euler steps needed
  text_scale: 3.0
  dino_scale: 2.5
  self_guidance: true
  guidance_scale: 3.0

validation:
  enabled: true
  interval_steps: 2500          # Only at checkpoints — eager 1024² validation is ~5h/run on 4090
  num_samples: 4                # In-train hooks: 4-sample LPIPS (fast); FULL 25-sample post-run via
                                # run_checkpoint_validation.py (AGENTS.md mandatory final gate)
  output_dir: "validation_outputs"
  run_reconstruction: true
  run_dino_swap: false          # Off in-train (adds time); run in the post-run full validation
  run_text_manip: false
  visual_debug_interval: 500    # Cheap (2-4 images, no LPIPS) — primary in-train visual trajectory
  visual_debug_num_samples: 4
  visual_debug_dir: "visual_debug"

checkpoint:
  save_every: 500               # Frequent: at 35s/it a 2500-interval = 24h of uncheckpointed
                                # work. SIGTERM interrupt-save is unreliable (observed silent
                                # death without checkpoint 2026-09-13) — periodic saves are
                                # the only trustworthy resume state.
  keep_last_n: 10
  output_dir: "checkpoints"
  save_optimizer: true

logging:
  log_every: 2
  log_file: "training.log"
  monitor_velocity_norm: true
  monitor_grad_norm: true
  velocity_norm_warning: 10.0
  grad_norm_warning: 10.0

paths:
  t5_path: "models/t5xxl_fp16.safetensors"
  vae_path: "/mnt/models/vae/ae.safetensors"   # FLUX AE: latent decode path (sampling/validation)
