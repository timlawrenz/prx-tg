arm: latent-first-pretrain
arm_letter: LFP
aliases: [latent-first, latent-pretrain]
mode: exploratory            # Set 2026-09-20, RETROACTIVELY. The arm launched 2026-09-13,
                             # before AGENTS.md §0.2 existed, so NO gate was frozen before
                             # the first run; per §0.7 rule 3 a non-pre-registered result is
                             # exploratory permanently. Confirm or overrule with Tim — do not
                             # quietly upgrade this to confirmatory.
hypothesis: >-
  Scheme B Phase 1: learning semantics in FLUX-AE latent space (16ch, 8x; 1024px ->
  128x128 latent, patch_size 2 keeping the 64x64 token grid of the pixel ps16
  champion) reaches comparable structural/semantic fidelity FASTER than
  pixel-from-scratch, so the remaining photorealism work can move to a cheaper
  Phase-2 pixel post-train.
falsified_if: >-
  Latent-space pretraining fails to reach comparable or better structural fidelity
  than the pixel-space champion at an equal step budget, or decoded latents show no
  semantic gain over pixel-from-scratch (no reduction in the fidelity work left for
  Phase 2).
pre_registered_gate: >-
  RETRO-DECLARED, NOT A REAL PRE-REGISTRATION — no numeric gate was frozen before the
  first run (the arm predates AGENTS.md §0.2). The only contemporaneous a-priori
  statement is the config header written 2026-09-13 21:59, before the 22:25 run start:
  "semantic/structural fidelity faster than pixel-from-scratch; measured by G0 gates +
  blind review on decoded latents." Any verdict from this arm is exploratory.
differs_from: faces70k-fp8
diff_summary: |
  - in_channels 3 -> 16 (FLUX-AE latent, 8x downsample)
  - patch_size 16 -> 2 (keeps the same 64x64 token grid at 1024px)
  - prediction_type: x_prediction on the clean LATENT x0 (target = clean latent)
  - data source: flux_latent.npy (16,128,128) instead of pixel.npy
  - latent_space: true (samplers decode through the FLUX AE)
  - sampling.num_steps 50 -> 24 (smaller latent space)
  - unchanged: 768x18 body, Muon lr 3e-4 -> min_lr 1e-6, REPA 0.5 (decay 4000->8000),
    TREAD self-guidance 3.0, fp8, effective batch 256 (4 x 64), same 70k FFHQ stratum

