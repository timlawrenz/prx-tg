arm: vae-ceiling
arm_letter: null
aliases: [vae-ceiling-test, vae_ceiling]

# No mode was declared before the run, so it cannot be claimed as confirmatory.
# A result seen before the mode is set is exploratory, permanently (AGENTS.md §0.7.3).
mode: undeclared

hypothesis: >
  The FLUX AE (the AE that produced the precomputed AbstractPhil/ffhq_flux_latents_repaired
  set) reconstructs real FFHQ faces faithfully enough that a latent-first model could reach
  photorealism without a pixel-space post-training phase.

falsified_if: >
  Encode->decode of a real photo through the AE fails the photoreal band - visibly washed
  out, low-contrast or mushy - meaning the autoencoder itself is the binding constraint on
  the achievable ceiling.

# Never written before the run. Recorded as the fact it is.
pre_registered_gate: >
  NOT PRE-REGISTERED. This is a retrospective record; no gate, falsification threshold or
  success criterion was committed before the run.

differs_from: latent-first-pretrain
diff_summary: |
  - not an ablation: a feasibility gate run BEFORE committing GPU time to latent-first
  - tests the autoencoder alone (encode->decode of real photos), no model training
  - produced the 1024²-encode decision and the first-class Part 2 (pixel) phase

