tags: [arm/vae-ceiling/registered]   # created 2026-09-19 on exp/vae-ceiling
conclusions:
  - >
    The precomputed AbstractPhil/ffhq_flux_latents_repaired set is 512², not 1024²
    (latent shape (16,64,64), verified externally against the HF datasets-server on
    2026-09-19). It cannot support a 1024² latent-first model -- do not use it.
  - >
    FLUX AE at its best scale reconstructs a recognizable but non-photoreal face:
    luminance 0.437 -> 0.855 and contrast 0.239 -> 0.154 (measured on the 4 saved
    sample indices). LPIPS 0.242 is the best of any configuration tested; SDXL VAE
    reaches 0.346 and is also non-photoreal.
  - >
    The VAE ceiling is real and material: the pixel-space post-training phase (Part 2)
    is not optional, and every G0-style gate must compare against decoded-real-latents
    rather than raw photos.
